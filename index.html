<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We've Moved</title>
    <meta name="description" content="This project has moved to https://ld.tarrow.de/">
    <link rel="icon" href="assets/favicon.webp" type="image/webp">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #14161a;
            color: #e6e8eb;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 24px;
        }
        main { max-width: 480px; }
        h1 { font-size: 1.75rem; margin: 0 0 12px; }
        p { margin: 0 0 24px; color: #9aa1ab; line-height: 1.5; }
        a.button {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            background: #5b8def;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        a.button:hover { background: #4a7be0; }

</head>
<body>
    <main>
        <h1>We've Moved</h1>
        <p>The Board Builder and Asset Browser have moved to a new home.</p>
        <a class="button" href="https://ld.tarrow.de/">Go to ld.tarrow.de</a>
